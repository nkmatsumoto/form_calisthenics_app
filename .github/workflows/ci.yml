name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: form_calisthenics_app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      CI: "true"
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/form_calisthenics_app_test
      CLOUDINARY_URL: cloudinary://api_key:api_secret@demo

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.12"
          bundler-cache: true

      - name: Setup database
        run: bin/rails db:prepare

      - name: Run tests
        run: bin/rails test

      - name: Compile production assets
        env:
          RAILS_ENV: production
          SECRET_KEY_BASE: dummy-secret-for-ci-asset-precompile
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/form_calisthenics_app_test
          CLOUDINARY_URL: cloudinary://api_key:api_secret@demo
        run: bin/rails assets:precompile
